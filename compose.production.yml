x-app-environment: &app-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: "3000"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  AUTH_SECRET: ${AUTH_SECRET}
  VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
  RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
  MOCK_VIDEO_URL: ${MOCK_VIDEO_URL:-https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  VIDEO_STORAGE_DIR: /app/data/videos
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

services:
  app:
    image: frameforge:production
    build: .
    restart: unless-stopped
    environment: *app-environment
    command: ["sh", "-c", "npm run db:deploy && npm run start"]
    expose:
      - "3000"
    volumes:
      - generated-videos:/app/data/videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: frameforge:production
    restart: unless-stopped
    environment: *app-environment
    command: ["npm", "run", "worker"]
    volumes:
      - generated-videos:/app/data/videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${CADDY_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${CADDY_HTTPS_BIND:-127.0.0.1:8443}:443"
      - "${CADDY_HTTPS_BIND:-127.0.0.1:8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  generated-videos:
  caddy-data:
  caddy-config:
